services:
  blaze:
    image: "samply/blaze:pr-3900@sha256:ce65baff58796fc92d73f7987420f05c7342a359fca6373482dcc7abf485cc38"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx2g"
      DB_BLOCK_CACHE_SIZE: "2048"
      ENABLE_ADMIN_API: "true"
    ports:
    - "8080:8080"
    volumes:
    - "blaze-data:/app/data"

volumes:
  blaze-data:
