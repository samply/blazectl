services:
  blaze:
    image: "samply/blaze:1.12.0@sha256:665c2f69efa333b3ea7b289973e087ee0db5429daa4c82fab7cbb6ca06f48624"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx2g"
      DB_BLOCK_CACHE_SIZE: "2048"
      ENABLE_ADMIN_API: "true"
    ports:
    - "8080:8080"
    volumes:
    - "blaze-data:/app/data"

volumes:
  blaze-data:
